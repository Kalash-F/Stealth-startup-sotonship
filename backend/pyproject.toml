[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbml"
version = "0.1.0"
description = "TBML invoice checker: price benchmarks + red-flag rules for trade invoices"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "jinja2>=3.1",
    "weasyprint>=60",
    "pyyaml>=6",
    "pandas>=2.1",
    "pyarrow>=15",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["tbml*"]

[tool.setuptools.package-data]
tbml = ["synthetic/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
