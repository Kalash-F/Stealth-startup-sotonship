[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tbml"
version = "0.1.0"
description = "TBML invoice checker: price benchmarks + red-flag rules for trade invoices"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "pyyaml>=6",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Offline tools only (fetch_benchmarks.py, the synthetic invoice generator). The API never imports
# them, so they stay out of the deployed function, which Vercel caps in size (DECISIONS DV1).
scripts = ["pandas>=2.1", "requests>=2.31", "jinja2>=3.1", "weasyprint>=60"]
dev = ["tbml[scripts]", "pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["tbml*"]

[tool.setuptools.package-data]
tbml = ["synthetic/templates/*.html", "rules/config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tbml/**" = ["E501"]  # long docstrings and reason strings read better unwrapped (DECISIONS D5.1)
"tbml/synthetic/catalogue.py" = ["E501"]  # data tables read better one entry per line
"scripts/fetch_benchmarks.py" = ["E501"]
"tests/test_benchmark.py" = ["E501"]
